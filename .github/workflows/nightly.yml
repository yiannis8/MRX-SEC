name: Nightly EDGAR update

on:
  schedule:
    # 05:30 UTC Tue–Sat = previous US business day is complete. (06:30 BST / 05:30 GMT)
    - cron: "30 5 * * 2-6"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Business days to (re)crawl"
        default: "10"

permissions:
  contents: write

concurrency:
  group: edgar-store
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl recent business days
        env:
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: python edgar_market.py --days-back ${{ github.event.inputs.days_back || '10' }}
      - name: Commit store
        run: |
          git config user.name "edgar-bot"
          git config user.email "edgar-bot@users.noreply.github.com"
          git add data/notes.csv data/failed.json
          git diff --cached --quiet && echo "no changes" || git commit -m "data: EDGAR update $(date -u +%F)"
          git push
