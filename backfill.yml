name: Backfill EDGAR history

# Run once per quarter of history (each takes ~30-40 min). Runs are additive.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-01-01"
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2025-03-31"

permissions:
  contents: write

concurrency:
  group: edgar-store
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl window
        env:
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: python edgar_market.py --start ${{ inputs.start }} --end ${{ inputs.end }}
      - name: Commit store
        run: |
          git config user.name "edgar-bot"
          git config user.email "edgar-bot@users.noreply.github.com"
          git add data/notes.csv data/failed.json
          git diff --cached --quiet && echo "no changes" || git commit -m "data: backfill ${{ inputs.start }}..${{ inputs.end }}"
          git pull --rebase
          git push
